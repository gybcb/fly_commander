name: FlyCommander
options:
  bundleIdPrefix: com.flycommander
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: "YES"
packages:
  Traversio:
    github: "GitSwiftHQ/Traversio"
    majorVersion: "1.0.7"
targets:
  TCCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TCCore
  FlyCommander:
    type: application
    platform: macOS
    sources:
      - path: Sources/FlyCommander
    dependencies:
      - target: TCCore
      - package: Traversio
        product: Traversio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flycommander.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.6"
        CURRENT_PROJECT_VERSION: "6"
  FlyCommanderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: FlyCommander
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flycommander.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  FlyCommander:
    build:
      targets:
        FlyCommander: all
    test:
      targets:
        - FlyCommanderUITests
