name: FlyCommander
options:
  bundleIdPrefix: com.flycommander
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  TCCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TCCore
  FlyCommander:
    type: application
    platform: macOS
    sources:
      - path: Sources/FlyCommander
    dependencies:
      - target: TCCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flycommander.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  FlyCommanderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: FlyCommander
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flycommander.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  FlyCommander:
    build:
      targets:
        FlyCommander: all
    test:
      targets:
        - FlyCommanderUITests
