name: Release

on:
  push:
    tags: ["v*.*.*"]
  # 手动触发 = dry-run：只构建并上传 artifact，release job 由 if 硬闸跳过。
  workflow_dispatch:
    inputs:
      version:
        description: "构建用版本号（不会创建 Release）"
        default: "0.0.1"
        required: false

permissions:
  contents: write

concurrency:
  # 固定组：并发发布（连续打 tag = 不同 ref）会让 updates 分支 push -f 竞态、
  # latest.json 可能落后于最新 release。跨 ref 串行化（false=排队不取消）。
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # tag 名经 env 传入并锚定正则校验（防 script injection：tag 语法上可含引号/分号）
      - name: Resolve version
        id: ver
        env:
          RAW_REF: ${{ github.ref_name }}
          DISPATCH_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            V="${RAW_REF#v}"
          else
            V="$DISPATCH_INPUT"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "非法版本号: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: sw_vers && xcodebuild -version

      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 显式解析远程包（Traversio），失败信息干净、不混进编译错误
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project FlyCommander.xcodeproj -scheme FlyCommander -derivedDataPath build

      # 版本号用 xcodebuild 位置参数 KEY=VALUE 覆盖（project.yml 里的值只是本地默认）。
      # 双架构各自单架构构建（非 universal，双 dmg 分发）：
      # - ARCHS 锁死单架构——Release 默认 ARCHS_STANDARD 会悄悄产出 universal，与分发决策矛盾。
      # - x86_64 在 arm64 runner 上交叉编译（xcodebuild 原生支持，Traversio SPM 同样出 x86_64 切片）。
      # 用 build 而非 test action：结构上不会触发 scheme test 段的 XCUITest。
      - name: Build (Release, ad-hoc signed, arm64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
        run: |
          xcodebuild -project FlyCommander.xcodeproj -scheme FlyCommander \
            -configuration Release -derivedDataPath build-arm64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build

      - name: Build (Release, ad-hoc signed, x86_64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
        run: |
          xcodebuild -project FlyCommander.xcodeproj -scheme FlyCommander \
            -configuration Release -derivedDataPath build-x86_64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build

      - name: Verify bundle (license / version / signature / arch)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for pair in "build-arm64 arm64" "build-x86_64 x86_64"; do
            set -- $pair
            APP=$1/Build/Products/Release/FlyCommander.app
            test -d "$APP"
            # 防版本漂移：产物版本必须等于 tag 解出的版本
            V=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
            [ "$V" = "$VERSION" ] || { echo "版本不符: $V"; exit 1; }
            # 防架构漂移：主二进制 fat 头必须只含目标架构
            lipo -archs "$APP/Contents/MacOS/FlyCommander" | grep -Exw "$2" \
              || { echo "$1 实际架构 $(lipo -archs "$APP/Contents/MacOS/FlyCommander") ≠ $2"; exit 1; }
            # AGPL：发布包内应含许可文本。注意顺序——往已签名 bundle 加文件会破坏
            # 签名 seal（实测 "a sealed resource is missing or invalid"），必须补文件后重签再校验。
            cp LICENSE "$APP/Contents/Resources/LICENSE"
            codesign --force --sign - "$APP"
            codesign --verify --strict --verbose=2 "$APP"
          done

      - name: Package dmg (per arch)
        env:
          DMG_PREFIX: FlyCommander_${{ steps.ver.outputs.version }}
        run: |
          for pair in "build-arm64 arm64" "build-x86_64 x86_64"; do
            set -- $pair
            STAGE=$(mktemp -d)
            cp -R $1/Build/Products/Release/FlyCommander.app "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            # hdiutil 在 CI 上偶发 transient 失败 → 重试 3 次
            for i in 1 2 3; do
              if hdiutil create -volname FlyCommander -srcfolder "$STAGE" -ov -format UDZO "${DMG_PREFIX}_$2.dmg"; then
                break
              fi
              [ "$i" = 3 ] && exit 1
              sleep 5
            done
          done
          ls -lh FlyCommander_*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: FlyCommander_*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push'   # 手动 dispatch 永不发布 —— dry-run 安全阀
    runs-on: ubuntu-latest
    steps:
      # updates 清单步需要 git 仓库（orphan 分支提交）；checkout 同时给
      # actions 内置 credential helper（后续 git push 用 GITHUB_TOKEN 免密）。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "FlyCommander Alpha-${VERSION} —— 早期预览版，功能与快捷键仍会变动。"
            echo
            echo "## 运行要求"
            echo "- macOS 14 (Sonoma)+；arm64 与 Intel (x86_64) 各有对应 dmg，App 内一键升级会自动选本机架构"
            echo
            echo "## 首次打开（重要）"
            echo "本应用未做 Apple 开发者签名与公证，Gatekeeper 会拦截（提示「已损坏」并非损坏）。"
            echo "放行方式见 README「安装」一节：System Settings → Privacy & Security → 仍要打开。"
            echo
            echo "## 源码与许可证"
            echo "FlyCommander 以 AGPL-3.0-or-later 授权（静态链接 AGPL 的 Traversio）。"
            echo "本 Release 的对应源码（可重建本二进制）： https://github.com/${REPO}/tree/${TAG}"
          } > notes.md

      # 供应链加固：有 contents:write 权限的第三方 action 钉死到 commit SHA（勿用浮动 tag）
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true   # 产物路径写错 → 报错，不静默空发
          name: FlyCommander Alpha-${{ needs.build.outputs.version }}
          prerelease: true
          body_path: notes.md

      # 版本检测+一键升级的版本源自托管清单：app 读
      # https://raw.githubusercontent.com/<repo>/updates/latest.json（免 GitHub API 限流；
      # 全 prerelease 使 /releases/latest 端点失效）。失败=升级静默断供 → 不得 continue-on-error。
      - name: Publish update manifest (updates branch)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 版本号/tag 全走 env + 锚定正则再校验（injection 硬闸先例同 Resolve version 步）
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "非法版本: $VERSION"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "非法 tag: $TAG"; exit 1; }
          printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' || { echo "非法 repo: $REPO"; exit 1; }
          # tag 与版本必须同源（app 端锚定 dmgURL==…/v<version>/…，失一致=清单永被判无效）
          [ "$TAG" = "v$VERSION" ] || { echo "tag($TAG) ≠ v+version($VERSION)，清单锚定会失配"; exit 1; }
          # 每架构 dmg 恰一个 + 命名与 dmgURL 模板逐字一致（防命名漂移 → 死链）。
          # arch 键必须与 app 侧 UpdateManifest.expectedDmgURL 模板的 "_<arch>.dmg" 完全一致。
          for arch in arm64 x86_64; do
            DMG="dist/FlyCommander_${VERSION}_${arch}.dmg"
            [ -f "$DMG" ] || { echo "缺产物: $DMG"; exit 1; }
            SHA=$(sha256sum "$DMG" | awk '{print $1}')
            printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{64}$' || { echo "sha256 异常: $SHA"; exit 1; }
            echo "{\"arch\":\"$arch\",\"sha\":\"$SHA\"}" >> arch_shas.jsonl
          done
          # JSON 交 python 生成（转义安全，ubuntu 自带 python3）
          python3 - "$VERSION" "$TAG" "$REPO" <<'PYEOF'
          import json, sys
          version, tag, repo = sys.argv[1:4]
          assets = {}
          for line in open("arch_shas.jsonl"):
              rec = json.loads(line)
              assets[rec["arch"]] = {
                  "dmgURL": f"https://github.com/{repo}/releases/download/{tag}/FlyCommander_{version}_{rec['arch']}.dmg",
                  "sha256": rec["sha"],
              }
          manifest = {
              "version": version,
              "assets": assets,
              # 旧格式镜像（arm64 顶层字段）：v0.0.8 及以前的存量 app 只认顶层
              # dmgURL/sha256，缺这支它们的升级检测会静默失效。新 app 优先读 assets。
              "dmgURL": assets["arm64"]["dmgURL"],
              "sha256": assets["arm64"]["sha256"],
              "notes": "See the release page for changes.",
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF
          cat latest.json
          # 全新 orphan（不带 main 历史；updates 分支只该有一个清单文件）
          git checkout --orphan updates
          git rm -rf --cached . -q   # 清掉 checkout 带进来的工作树索引（文件留在盘上但不再入库）
          git add latest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(update): latest.json → v${VERSION} [skip ci]"
          git push -f origin updates   # checkout 已配好 GITHUB_TOKEN credential helper；强推=幂等
